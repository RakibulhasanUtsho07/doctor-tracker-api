openapi: 3.1.0
info:
  title: Doctor Tracker API
  version: 1.0.0
  description: Planning contract only; route presence must be verified separately.
servers:
  - url: http://localhost:4000/api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Liveness check
      responses:
        '200': { description: API process alive }
  /auth/login:
    post:
      security: []
      summary: Administrator login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 128, format: password }
      responses:
        '200': { description: Authenticated }
        '401': { description: Invalid credentials }
        '429': { description: Rate limited }
  /auth/logout:
    post:
      summary: End session
      responses:
        '204': { description: Logged out }
  /auth/me:
    get:
      summary: Current administrator
      responses:
        '200': { description: Current user }
  /dashboard/summary:
    get:
      summary: Read totals and date-based aggregates
      responses:
        '200': { description: Dashboard metrics }
  /doctors:
    get:
      summary: Search, filter and paginate doctors
      parameters:
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: specialization, schema: { type: string, maxLength: 100 } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Paginated doctor list }
    post:
      summary: Create doctor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DoctorInput' }
      responses:
        '201': { description: Created }
  /doctors/{doctorId}:
    parameters:
      - { in: path, name: doctorId, required: true, schema: { type: string } }
    get:
      summary: Read doctor
      responses:
        '200': { description: Doctor detail }
        '404': { description: Not found }
    patch:
      summary: Update doctor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DoctorInput' }
      responses:
        '200': { description: Updated }
  /doctors/{doctorId}/patients:
    get:
      summary: List patients for a doctor
      parameters:
        - { in: path, name: doctorId, required: true, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Paginated associated patients }
  /patients:
    get:
      summary: Search/filter/paginate patients
      parameters:
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: doctorId, schema: { type: string } }
        - { in: query, name: condition, schema: { type: string, maxLength: 100 } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Paginated patient list }
    post:
      summary: Create patient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientInput' }
      responses:
        '201': { description: Created }
  /patients/{patientId}:
    parameters:
      - { in: path, name: patientId, required: true, schema: { type: string } }
    get:
      summary: Read patient
      responses:
        '200': { description: Patient detail }
    patch:
      summary: Update patient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientInput' }
      responses:
        '200': { description: Updated }
    delete:
      summary: Delete patient; semantics must be approved before implementation
      responses:
        '204': { description: Deleted }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provisional; final authentication design is pending ADR-002.
  schemas:
    DoctorInput:
      type: object
      additionalProperties: false
      required: [name, specialization, hospital, phone, email]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        specialization: { type: string, minLength: 2, maxLength: 120 }
        hospital: { type: string, minLength: 2, maxLength: 160 }
        phone: { type: string, minLength: 5, maxLength: 30 }
        email: { type: string, format: email, maxLength: 254 }
    PatientInput:
      type: object
      additionalProperties: false
      required: [doctorId, name]
      properties:
        doctorId: { type: string, minLength: 1 }
        name: { type: string, minLength: 2, maxLength: 120 }
        condition: { type: string, maxLength: 100, description: Confirm vocabulary before implementation. }
